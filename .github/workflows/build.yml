name: Build FontTweaks 26.3
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build, run tests and bundle pinned fonts
        run: gradle clean build --stacktrace
      - name: Verify Minecraft hooks and real multiline spacing without opening a game window
        run: gradle runSmoke -x downloadAssets --stacktrace
      - name: Verify installed font assets and copyright notices
        run: |
          set -euo pipefail
          python3 scripts/verify_font_assets.py
          mkdir -p build/distribution
          JAR=$(find build/libs -maxdepth 1 -type f -name 'fonttweaks-*.jar' ! -name '*sources*' ! -name '*dev*' | head -1)
          test -n "$JAR"
          for path in \
            assets/fonttweaks/font/misaki.json \
            assets/misakigothic2/font/shift_jis.json \
            assets/misakigothic2/textures/font/shift_jis.png \
            META-INF/THIRD_PARTY_NOTICES.md; do
            echo "Checking $path in $JAR"
            jar tf "$JAR" | grep -Fxq "$path"
          done
          cp "$JAR" build/distribution/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fonttweaks-26.3
          path: build/distribution/*.jar
          if-no-files-found: error

