name: Build FontTweaks 26.3
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Inspect upstream Misaki pack contents
        run: |
          curl -fsSL --retry 3 'https://cdn.modrinth.com/data/4M0C1Ypo/versions/ce2snAzP/MisakiGothic2forMC_26_3.zip' -o /tmp/misaki.zip
          sha256sum /tmp/misaki.zip
          unzip -Z -1 /tmp/misaki.zip | head -90
          for name in $(unzip -Z -1 /tmp/misaki.zip | grep -E 'assets/.*/font/.*\.json$' | head -4); do
            echo "===== $name ====="
            unzip -p /tmp/misaki.zip "$name" | head -c 1400
            echo
          done
      - name: Compile and package
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fonttweaks-26.3
          path: build/libs/*.jar
          if-no-files-found: error
