plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version + '+26.3'
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // Zoomify 2.17.0 uses YACL v3. Build the same native GUI with YACL 3.9.7 for 26.3.
    implementation "maven.modrinth:1eAoo2KR:s9SjoFu1"
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.12.2"
}

processResources {
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('test') {
    useJUnitPlatform()
}


//
// Bundled 8x8 Misaki Gothic 2 resource-pack assets (Minecraft 26.3).
// Fetch a PINNED immutable upstream release and verify its exact SHA-256.
// The resulting JAR contains the font; users do not install a second pack.
//
def misakiUrl = 'https://cdn.modrinth.com/data/4M0C1Ypo/versions/ce2snAzP/MisakiGothic2forMC_26_3.zip'
def misakiSha256 = 'a09b2f0ea1e911fe4dd83fac39953a447a69c42fecc544d9af723a84954eee8d'
def misakiZip = layout.buildDirectory.file('vendor/MisakiGothic2forMC_26_3.zip')
def misakiResources = layout.buildDirectory.dir('generated/misaki-font')

def downloadMisaki = tasks.register('downloadMisaki', DefaultTask) {
    outputs.file(misakiZip)
    doLast {
        File dest = misakiZip.get().asFile
        dest.parentFile.mkdirs()
        def conn = new URI(misakiUrl).toURL().openConnection()
        conn.setConnectTimeout(20000)
        conn.setReadTimeout(45000)
        conn.setRequestProperty('User-Agent', 'FontTweaks/0.3.0 (+https://github.com/Sanowo0390/FontTweaks)')
        try (def input = conn.getInputStream(); def output = new FileOutputStream(dest)) {
            input.transferTo(output)
        }
        def digester = java.security.MessageDigest.getInstance('SHA-256')
        def actual = java.util.HexFormat.of().formatHex(digester.digest(java.nio.file.Files.readAllBytes(dest.toPath())))
        if (actual != misakiSha256) {
            dest.delete()
            throw new GradleException("Misaki archive SHA-256 mismatch: ${actual}")
        }
    }
}

def prepareMisaki = tasks.register('prepareMisaki', Sync) {
    dependsOn downloadMisaki
    from({ zipTree(misakiZip.get().asFile) }) {
        include 'assets/minecraft/font/default.json'
        include 'assets/misakigothic2/font/**'
        include 'assets/misakigothic2/textures/**'
        eachFile { details ->
            if (details.path == 'assets/minecraft/font/default.json') {
                details.path = 'assets/fonttweaks/font/misaki.json'
            }
        }
        includeEmptyDirs = false
    }
    into misakiResources
}

sourceSets.main.resources.srcDir(misakiResources)
tasks.named('processResources').configure {
    dependsOn prepareMisaki
    // Remove the old override even on an incremental upgrade from 0.3.1.
    doFirst {
        delete layout.buildDirectory.file('resources/main/assets/minecraft/font/default.json')
    }
}

// Original PixelMplus12 Regular, pinned to its upstream commit and exact bytes.
def pixelFont = layout.buildDirectory.file('generated/pixelmplus/assets/fonttweaks/font/pixelmplus12_regular.ttf')
def pixelSha256 = '02f19467ea7cc235cc06c570b7f6c3b0a12a6f682bc8d74c43f2d323d97bcd12'
def downloadPixelMplus = tasks.register('downloadPixelMplus', DefaultTask) {
    inputs.property 'sha256', pixelSha256
    outputs.file(pixelFont)
    doLast {
        File dest = pixelFont.get().asFile
        dest.parentFile.mkdirs()
        def url = 'https://raw.githubusercontent.com/itouhiro/PixelMplus/d89b95f04eeb95bf98bb09cb9234a2f99d186df5/PixelMplus12-Regular.ttf'
        def connection = new URI(url).toURL().openConnection()
        connection.setConnectTimeout(20000)
        connection.setReadTimeout(45000)
        try (def input = connection.getInputStream(); def output = new FileOutputStream(dest)) {
            input.transferTo(output)
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def actual = java.util.HexFormat.of().formatHex(digest.digest(dest.bytes))
        if (actual != pixelSha256) {
            dest.delete()
            throw new GradleException("PixelMplus12 SHA-256 mismatch: ${actual}")
        }
    }
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/pixelmplus'))
tasks.named('processResources').configure { dependsOn downloadPixelMplus }

// Launch Fabric far enough to verify transformed Minecraft classes and line
// spacing, then exit in preLaunch before creating any window or loading a world.
sourceSets {
    smoke { compileClasspath += sourceSets.main.compileClasspath }
}
def smokeJar = tasks.register('smokeJar', Jar) {
    from sourceSets.smoke.output
    archiveFileName = 'fonttweaks-smoke.jar'
    destinationDirectory = layout.buildDirectory.dir('smoke')
}
loom.runs {
    smoke {
        client()
        source sourceSets.main
        runDir 'run-smoke'
        vmArg "-Dfabric.addMods=${layout.buildDirectory.file('smoke/fonttweaks-smoke.jar').get().asFile.absolutePath}"
    }
}
tasks.named('runSmoke').configure { dependsOn smokeJar }

